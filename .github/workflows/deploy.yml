name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate compact database files
        run: |
          node <<'NODE'
          const fs = require('fs');
          const vm = require('vm');

          const datasets = [
            { source: 'data/aircraft.js', target: 'data/aircraft.min.js', name: 'AIRCRAFT_DATABASE' },
            { source: 'data/airports.js', target: 'data/airports.min.js', name: 'AIRPORTS_DATABASE' },
          ];

          for (const { source, target, name } of datasets) {
            const context = {};
            const code = fs.readFileSync(source, 'utf8') + `; globalThis.__data = ${name};`;
            vm.runInNewContext(code, context, { filename: source });
            const output = `/* Generated compact dataset. Source: ${source} */\nconst ${name} = ${JSON.stringify(context.__data)};\n`;
            fs.writeFileSync(target, output);
          }
          NODE

      - name: Inject Cache-Bust Commit SHA into index.html
        env:
          COMMIT_SHA: ${{ github.sha }}
        run: |
          python3 -c "import os, re; p='index.html'; c=open(p, encoding='utf-8').read(); open(p, 'w', encoding='utf-8').write(re.sub(r'(\.js\?v=)[^\"\' >]+', r'\g<1>'+os.environ['COMMIT_SHA'], c))"

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
