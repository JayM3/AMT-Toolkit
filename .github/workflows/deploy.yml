name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inject Cache-Bust Commit SHA into index.html
        env:
          COMMIT_SHA: ${{ github.sha }}
        run: |
          python3 -c "import os, re; p='index.html'; c=open(p, encoding='utf-8').read(); open(p, 'w', encoding='utf-8').write(re.sub(r'(\.js\?v=)[^\"\' >]+', r'\g<1>'+os.environ['COMMIT_SHA'], c))"

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
